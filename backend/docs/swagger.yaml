      tags:
      - settings
  /settings/model-option-policy:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 查询模型 options 透传策略
      tags:
      - settings
  /student/quizzes:
    get:
      description: 学生查询当前班级已发布的小测；响应不包含正确答案。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/StudentQuizListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
