info:
  contact: {}
  description: CourseMate 后端 API 文档
  title: CourseMate API
  version: "0.4.4-beta.3"
paths:
  /admin/audit-logs:
    get:
      consumes:
      - application/json
      description: 管理员分页查看全量可追溯审计日志
      parameters:
      - description: 页码（从 1 开始，默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（1-1000，默认 20）
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: query
        type: string
      - description: 资源类型
        in: query
        name: resource
        type: string
      - description: 动作
        in: query
        name: action
        type: string
      - description: 操作人用户ID
        in: query
        name: actor_user_id
        type: integer
      - description: 创建时间起点(RFC3339)
        in: query
        name: created_from
        type: string
      - description: 创建时间终点(RFC3339)
        in: query
        name: created_to
        type: string
      - description: 排序方式
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuditLogListResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AdminErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员查询审计日志
      tags:
      - admin
  /admin/auth/provider-order:
    patch:
      consumes:
      - application/json
      description: 管理员保存第三方身份源的展示顺序
      parameters:
      - description: 身份源顺序
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ReorderIdentityProvidersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IdentityProviderReorderResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AuthErrorDoc'
      security:
      - BearerAuth: []
      summary: 调整第三方身份源顺序
      tags:
      - admin-auth
  /admin/auth/providers:
    get:
      description: 管理员查看已配置的 OIDC 和 OAuth2 身份源
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IdentityProviderListResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AuthErrorDoc'
      security:
      - BearerAuth: []
      summary: 获取第三方身份源列表
      tags:
      - admin-auth
    post:
      consumes:
      - application/json
      description: 管理员创建一个 OIDC 或 OAuth2 身份源
      parameters:
      - description: 身份源配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpsertIdentityProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IdentityProviderResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AuthErrorDoc'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/AuthErrorDoc'
      security:
      - BearerAuth: []
      summary: 创建第三方身份源
      tags:
      - admin-auth
  /admin/auth/providers/{provider_id}:
    delete:
      description: 管理员删除第三方身份源；force=true 时允许删除仍有关联用户的身份源
      parameters:
      - description: 身份源 ID
        in: path
        name: provider_id
        required: true
        type: string
      - description: 是否强制删除
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IdentityProviderDeleteResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AuthErrorDoc'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/AuthErrorDoc'
      security:
      - BearerAuth: []
      summary: 删除第三方身份源
      tags:
      - admin-auth
    patch:
      consumes:
      - application/json
      description: 管理员更新一个 OIDC 或 OAuth2 身份源
      parameters:
      - description: 身份源 ID
        in: path
        name: provider_id
        required: true
        type: string
      - description: 身份源配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpsertIdentityProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IdentityProviderResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AuthErrorDoc'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/AuthErrorDoc'
      security:
      - BearerAuth: []
      summary: 更新第三方身份源
      tags:
      - admin-auth
  /admin/content-moderation/config:
    get:
      description: 返回当前内容审核配置与可选审核类别目录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ContentModerationConfigResponseDoc'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ContentmoderationErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ContentmoderationErrorDoc'
      security:
      - BearerAuth: []
      summary: 查询内容审核配置
      tags:
      - admin-content-moderation
