      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PublicModelListResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
      security:
      - BearerAuth: []
      summary: 查询可用模型目录
      tags:
      - llm
  /quizzes/{id}/close:
