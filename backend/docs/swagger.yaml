  /user/settings:
    get:
      description: 返回当前用户全部个人偏好配置，缺失项以默认值填充
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserSettingsResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 获取当前用户的配置
      tags:
      - user/settings
    patch:
      consumes:
      - application/json
      description: 批量更新用户个人偏好配置，返回更新后的全量配置
      parameters:
      - description: 更新项
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UserSettingsPatchSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserSettingsResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 更新当前用户的配置
      tags:
      - user/settings
  /user/stats/activity:
    get:
      consumes:
      - application/json
      description: 查询当前用户按用量归属日聚合的模型请求数与 token 消耗，逐日补零
      parameters:
      - description: 统计天数(默认365，最大366)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDailyActivityListResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/UserErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/UserErrorDoc'
      security:
      - BearerAuth: []
      summary: 查询每日活跃度
      tags:
      - user
  /users/{public_id}/avatar:
    get:
      description: 公开读取用户当前上传的头像图片。头像须为已上传的图片文件，实际类型受上传 MIME 白名单约束（默认 PNG/JPEG/WebP/GIF，SVG
        等活动内容始终拒绝）；未上传头像时返回 404，错误响应为 JSON
      parameters:
      - description: 用户 public_id
        in: path
        name: public_id
        required: true
        type: string
      produces:
      - image/png
      - image/jpeg
      - image/webp
      - image/gif
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/UserErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/UserErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/UserErrorDoc'
      summary: 获取用户头像
      tags:
      - user
securityDefinitions:
  BearerAuth:
