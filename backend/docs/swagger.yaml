      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChatFilePolicyResponseDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ConversationErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ConversationErrorDoc'
