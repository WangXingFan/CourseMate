      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FeaturePolicyResponseDoc'
      security:
      - BearerAuth: []
      summary: 查询用户侧功能开关策略
      tags:
      - settings
  /settings/login-page:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Envelope'
