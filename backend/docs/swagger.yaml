      parameters:
      - description: 小测公开 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ClassroomMutationResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 截止班级小测
      tags:
      - classrooms
  /quizzes/{id}/open:
    post:
      description: 教师发布小测后，班级学生可在学生端看到题目。
      parameters:
      - description: 小测公开 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ClassroomMutationResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 发布班级小测
      tags:
      - classrooms
  /quizzes/{id}/submissions:
    get:
      description: 教师查看提交率、选项分布、未提交名单与逐份提交记录。
      parameters:
      - description: 小测公开 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QuizReportResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 查询小测统计
      tags:
      - classrooms
    post:
      consumes:
      - application/json
      description: 学生提交一次答案并得到得分；重复提交返回 409。
      parameters:
      - description: 小测公开 ID
        in: path
        name: id
        required: true
        type: string
      - description: 答案
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SubmitQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QuizSubmissionResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 提交小测答案
      tags:
      - classrooms
  /runtime/chat-file-policy:
    get:
