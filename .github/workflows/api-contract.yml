name: API contract

# Manual maintenance job: regenerate backend Swagger and the TypeScript API
# contract from the Go handler annotations and publish them on a dedicated
# side branch. The Web CI job verifies freshness with `generate.mjs --check`,
# which needs a Go toolchain, so this keeps the generated files authoritative
# without requiring a local Go install. Merge the side branch into the working
# branch together with the handler changes so a single push stays green.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OUTPUT_BRANCH: regen/api-contract

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate API contract
        run: pnpm api:generate
      - name: Publish to side branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/docs packages/api-contract/src/types.generated.ts
          if git diff --cached --quiet; then
            echo "API contract already up to date."
            git commit --allow-empty -m "chore: regenerate api contract"
          else
            git commit -m "chore: regenerate api contract"
          fi
          git push --force origin "HEAD:refs/heads/${{ env.OUTPUT_BRANCH }}"
