services:
  tika:
    image: apache/tika:3.2.3.0
    ports:
      # Optional. Localhost-only by default. Configure the app to use http://tika:9998 on the shared network.
      - "127.0.0.1:${COURSEMATE_TIKA_PORT:-9999}:9998"
    restart: unless-stopped
    networks:
      - coursemate

networks:
  coursemate:
    # Required. Start a root compose profile first, or create this network manually.
    external: true
    name: coursemate-network
